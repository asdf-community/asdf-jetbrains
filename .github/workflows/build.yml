name: Build

on:
  push:
    branches:
      - main
  pull_request:
  # The releases API and archive layouts are not ours: a weekly run notices their changes.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  plugin_test:
    name: install and run
    strategy:
      fail-fast: false
      matrix:
        # The weekly run skips macOS arm64 (macos-latest): GitHub often has no free runner for it
        # and cancels the job, while the run is meant to notice changes of the download sites.
        os: ${{ github.event_name == 'schedule' && fromJSON('["ubuntu-latest", "macos-15-intel"]') || fromJSON('["ubuntu-latest", "macos-latest", "macos-15-intel"]') }}
        # Gateway is the smallest IDE, the others are 1-3 GB.
        product:
          - plugin: gateway
            command: gateway
            output: Gateway
          - plugin: toolbox
            command: jetbrains-toolbox
            output: Toolbox
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: asdf-vm/actions/setup@v4
      # Not asdf-vm/actions/plugin-test: "asdf plugin test" of asdf 0.16 and later does not run the test command.
      - name: Install and run
        env:
          PLUGIN: ${{ matrix.product.plugin }}
          COMMAND: ${{ matrix.product.command }}
          OUTPUT: ${{ matrix.product.output }}
        run: |
          plugins="${ASDF_DATA_DIR:-$HOME/.asdf}/plugins"
          mkdir -p "$plugins"
          cp -R "$GITHUB_WORKSPACE" "$plugins/$PLUGIN"
          version=$(asdf latest "$PLUGIN")
          asdf install "$PLUGIN" "$version"
          asdf set "$PLUGIN" "$version"
          "$COMMAND" --version | tee output.txt
          grep -q "$OUTPUT $version" output.txt
