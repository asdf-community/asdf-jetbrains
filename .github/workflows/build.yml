name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      # Gateway is the smallest product, the others are 1-3 GB.
      - name: asdf_plugin_test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          plugin: gateway
          command: gateway --version
